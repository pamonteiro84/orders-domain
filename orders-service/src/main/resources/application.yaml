spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${ORDERS_DB_NAME:orders}
    username: ${ORDERS_DB_USERNAME}
    password: ${ORDERS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  expiration: 15m

logging:
  level:
    "[org.hibernate.SQL]": debug
