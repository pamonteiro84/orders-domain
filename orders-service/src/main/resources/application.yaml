spring:
  application:
    name: orders-service
  # Values come from env vars (locally: .env, exported by the Makefile).
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:orders}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

logging:
  level:
    "[org.hibernate.SQL]": debug
