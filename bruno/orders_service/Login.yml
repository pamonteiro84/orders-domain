info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{ordersUrl}}/auth/login"
  body:
    type: json
    data: '{ "email": "examplo@email.pt", "password": "segredo123" }'

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
