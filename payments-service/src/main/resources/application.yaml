spring:
  application:
    name: payments-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:${PAYMENTS_DB_PORT:5434}/${PAYMENTS_DB_NAME:payments}
    username: ${ORDERS_DB_USERNAME}
    password: ${PAYMENTS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    consumer:
      group-id: payments-service
      auto-offset-reset: earliest

management:
  health:
    redis:
      enabled: false

server:
  port: 8081

jwt:
  public-key: ${JWT_PUBLIC_KEY}
